<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmed — Marlowe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mast"><span>Brooklyn · Issue 09</span><button data-bag>Satchel <span data-count>0</span></button></div>
  <header class="issue">
    <h1>MARLOWE DEVICES</h1>
    <p>Confirmed</p>
    <button class="ham" id="ham">☰</button>
  </header>
  <nav class="issue-nav" id="nav">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="product.html">Studio Book</a>
    <a href="about.html">About</a>
    <a href="support.html">Support</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="frame" style="text-align:center;padding:72px 0 100px">
    <div class="eyebrow">Creative Row fulfillment</div>
    <h2 style="font-size:48px;font-weight:400">The issue is closed.</h2>
    <p id="oid" class="sans" style="letter-spacing:0.2em;margin:12px 0"></p>
    <div id="items" class="sans" style="max-width:420px;margin:20px auto;text-align:left"></div>
    <a class="amber" href="index.html">Return to cover</a>
  </div>
  <footer class="mw"><div class="frame"><p>305 Creative Row, Brooklyn, NY 11201 · hello@marlowestudio.com · +1 718 555 0165</p></div></footer>
  <div class="shade" id="shade"></div>
  <aside class="drawer" id="drawer">
    <div class="dh sans"><strong>Satchel</strong><button class="linebtn" id="dclose">Close</button></div>
    <div class="db" id="db"></div>
    <div class="df sans"><span id="dt">$0</span><a class="amber" href="cart.html">Review</a></div>
  </aside>
  <script src="js/app.js"></script>
  <script>
    const o=JSON.parse(sessionStorage.getItem("marlowe_order")||"null");
    if(!o) location.href="shop.html";
    else {
      document.getElementById("oid").textContent=o.id;
      document.getElementById("items").innerHTML=o.items.map(i=>`<p>${i.name} — ${i.config} · ${MW.money(i.price*i.qty)}</p>`).join("")+`<p><strong>Paid ${MW.money(o.total)}</strong></p>`;
    }
  </script>
  <script src="https://cdn.zanderio.ai/widget/loader.js" data-id="wdg_LWJl1wrJzMMq6QCDhFwU3sx0" defer></script>
</body>
</html>
